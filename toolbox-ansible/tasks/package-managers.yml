- name: Packages for cargo
  community.general.cargo:
    name:
      - stylua
      - typst-cli
    state: present

- name: Packages for pip
  pip:
    name:
      - pynvim

# The old playbook installed nvm here; pnpm and Fedora's nodejs replace it.
- name: Remove nvm
  ansible.builtin.file:
    path: "~/.config/nvm"
    state: absent
