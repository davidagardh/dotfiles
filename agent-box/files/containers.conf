# Nested rootless podman inside the agent container. Adapted from
# quay.io/podman/stable (containers/image_build). The outer container already
# provides isolation, so inner containers reuse its namespaces instead of
# creating new ones, which a nested user namespace can't do reliably.
[containers]
netns = "host"
userns = "host"
ipcns = "host"
utsns = "host"
cgroupns = "host"
cgroups = "disabled"
log_driver = "k8s-file"
volumes = [
  "/proc:/proc",
]
default_sysctls = []

[engine]
cgroup_manager = "cgroupfs"
events_logger = "file"
runtime = "crun"

